{% load static %}
{% include 'admin_header.html' %}

<style>
    body {
        background-image:linear-gradient(to right,green,purple);
        background-size: cover;
        backdrop-filter: blur(4px);
    }

    .form-wrapper {
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .form-card {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 18px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        width: 100%;
        max-width: 850px;
        animation: fadeIn 0.5s ease;
    }

    .form-title {
        font-size: 26px;
        font-weight: 700;
        color: #2c3e50;
        text-align: center;
        margin-bottom: 25px;
        text-transform: uppercase;
    }

    .btn-submit {
        background: #0066cc;
        color: #fff;
        padding: 10px 25px;
        border-radius: 6px;
        font-weight: 600;
        transition: 0.3s;
    }

    .btn-submit:hover {
        background: #004e99;
        color: #fff;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="form-wrapper">
    <div class="form-card">

        <h2 class="form-title">
            <i class="fa fa-child"></i> Add Child Information
        </h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Age</label>
                    <input type="text" class="form-control" name="t1" required
                           placeholder="Enter age">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Gender</label><br>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="male" name="r1" value="male" required>
                        <label class="form-check-label" for="male">Male</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="female" name="r1" value="female">
                        <label class="form-check-label" for="female">Female</label>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Child Name</label>
                    <input type="text" class="form-control" name="t2" placeholder="Enter child name" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Blood Group</label>
                    <input type="text" class="form-control" name="t3" placeholder="e.g. O+ , B+">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Date of Birth</label>
                    <input type="date" class="form-control" name="t4" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Date of Joining</label>
                    <input type="date" class="form-control" name="t5" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Upload Photo</label>
                <input class="form-control" type="file" name="myfile">
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-submit">
                    <i class="fa fa-save"></i> Submit
                </button>
            </div>
        </form>

    </div>
</div>

<footer class="site-footer bg-dark text-white mt-5">
    <div class="footer-bar bg-secondary py-3 text-center">
        <p class="m-0">
            Copyright &copy;
            <script>document.write(new Date().getFullYear());</script> OrphanAssist
        </p>
    </div>
</footer>

<script src="{% static 'js/jquery.js' %}"></script>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
