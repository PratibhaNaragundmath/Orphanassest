{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Child Adoption - Change Password</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: #f1f3f8;
        }
        .brand-title {
            font-size: 42px;
            font-weight: bold;
            color: rgba(11, 4, 4, 0.98);
        }
        .card {
            border-radius: 15px;
        }
        .input-group-text {
            background: #eef1f5;
        }
        footer p {
            font-size: 14px;
        }
    </style>
</head>

<body>

<!-- Header -->
<header class="bg-dark text-white py-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="brand-title">Orphan Assist</span>
        <a href="javascript:window.history.back()" class="btn btn-warning btn-sm">
            <i class="fa fa-arrow-left"></i> Back
        </a>
    </div>
</header>

<!-- Change Password Form Section -->
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">

            <div class="card shadow-lg border-0">
                <div class="card-body p-4">

                    <h3 class="text-center text-primary mb-4">
                        <i class="fa fa-key"></i> Change Password
                    </h3>

                    {% if msg %}
                        <div class="alert alert-danger text-center">
                            <i class="fa fa-exclamation-circle"></i> {{ msg }}
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <!-- Current Password -->
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa fa-lock"></i></span>
                                <input type="password" name="t2" id="t2" class="form-control" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('t2', this)">
                                    <i class="fa fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- New Password -->
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa fa-key"></i></span>
                                <input type="password" name="t3" id="t3" class="form-control" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('t3', this)">
                                    <i class="fa fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa fa-check"></i></span>
                                <input type="password" name="t4" id="t4" class="form-control" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('t4', this)">
                                    <i class="fa fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-save"></i> Submit
                            </button>
                            <button type="reset" class="btn btn-secondary">
                                <i class="fa fa-undo"></i> Reset
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white py-3 mt-5 text-center">
    <p class="mb-0">
        Copyright © <script>document.write(new Date().getFullYear());</script>
        All Rights Reserved | Janani
    </p>
</footer>

<!-- JS -->
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

<script>
function togglePassword(fieldId, btn) {
    const input = document.getElementById(fieldId);
    const icon = btn.querySelector("i");

    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}
</script>

</body>
</html>
