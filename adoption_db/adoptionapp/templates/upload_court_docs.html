{% load static %}
{% include 'parent_header.html' %}

<style>
    .page-title {
        font-weight: 800;
        color: #0056b3;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .upload-card {
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        padding: 30px;
    }

    .form-label {
        font-weight: 600;
        color: #333;
    }

    .file-input {
        border: 1px solid #ced4da;
        padding: 8px;
        border-radius: 6px;
        background: #f8f9fa;
        width: 100%;
    }

    .submit-btn {
        width: 100%;
        background: #0056b3;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
    }
    .submit-btn:hover {
        background: #003d80;
    }

    .side-img {
        width: 100%;
        border-radius: 18px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }
</style>

<div class="container py-5">

    <h2 class="text-center page-title mb-4">
        <i class="fa fa-upload"></i> Upload Court Documents
    </h2>

    <div class="row g-4">

        <!-- Form Section -->
        <div class="col-lg-6">

            <div class="upload-card">

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Court Affidavit Certificate</label>
                        <input type="file" name="myfile" class="file-input" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Caste Certificate</label>
                        <input type="file" name="myfile1" class="file-input" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Aadhar Card</label>
                        <input type="file" name="myfile2" class="file-input" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address Proof</label>
                        <input type="file" name="myfile3" class="file-input" required>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fa fa-check-circle"></i> Submit Documents
                    </button>
                </form>

            </div>
        </div>

        <!-- Image Section -->
        <div class="col-lg-6 text-center">
            <img src="{% static 'images/welcome.jpg' %}" class="side-img" alt="Upload Documents">
        </div>

    </div>

</div>


<footer class="site-footer bg-dark text-white mt-5">
  <div class="footer-bar bg-secondary py-3 text-center">
    <div class="container">
      <p class="m-0">
        Copyright &copy;
        <script>document.write(new Date().getFullYear());</script>
        All rights reserved | OrphanAssest
      </p>
    </div>
  </div>
</footer>
